# Drop-in for the versioned release layout (deploy/deploy_release.sh). Install it as
# /etc/systemd/system/aiscientist.service.d/release-layout.conf, then `systemctl daemon-reload`.
# app/current is a symlink to the active release and each release has its own venv, so a deploy or a
# rollback is a symlink switch plus a restart. Removing this file returns the unit to the rsync layout
# (app/ and env/) of aiscientist.service.
[Service]
WorkingDirectory=/data/aiscientist/app/current
EnvironmentFile=
EnvironmentFile=-/data/aiscientist/config/.env
ExecStart=
ExecStart=/data/aiscientist/app/current/.venv/bin/python -m aiscientist.gateway --host 128.200.71.197 --port 8800
# The start fails if the app does not answer /health, so a bad release shows in systemctl.
ExecStartPost=/usr/bin/curl --retry 30 --retry-delay 2 --retry-connrefused -fsS -o /dev/null http://128.200.71.197:8800/health
