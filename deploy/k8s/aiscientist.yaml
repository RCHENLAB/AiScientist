# AiScientist in a pod: the service image of one release, its data volume and its Service.
# The guide is deploy/k8s/README.md. The lab server does not use this file: there the app is a host
# systemd unit, and the cluster only routes to it (host-backend.yaml).
#
# Before applying, create the Secret aiscientist-secrets and the ConfigMap aiscientist-config, and
# set the image to the digest the release notes name (README):
#
#   sed "s#ghcr.io/rchenlab/aiscientist@sha256:<digest>#$IMAGE#" deploy/k8s/aiscientist.yaml \
#     | kubectl -n aiscientist apply -f -
#
# The gateway holds each session's SSH connection to HPC3 in memory, in one process:
#   - one replica and strategy Recreate: never two pods at once;
#   - replacing the pod ends the live sessions: users stay signed in and connect to HPC3 again;
#   - the pod needs egress to DNS and to HPC3's SSH port (22).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiscientist-data
  labels: { app.kubernetes.io/name: aiscientist }
spec:
  accessModes: ["ReadWriteOnce"]           # one pod
  # storageClassName: <class>              # unset: the cluster's default class
  resources:
    requests:
      storage: 50Gi                        # datasets, uploads and run outputs; the saved keys
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiscientist
  labels: { app.kubernetes.io/name: aiscientist }
spec:
  replicas: 1                              # a second pod could not see the first one's sessions
  strategy:
    type: Recreate                         # stop the old pod before the new one starts
  selector:
    matchLabels: { app.kubernetes.io/name: aiscientist }
  template:
    metadata:
      labels: { app.kubernetes.io/name: aiscientist }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                   # the image's account
        runAsGroup: 10001
        fsGroup: 10001                     # makes the volume writable by the app
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/rchenlab/aiscientist@sha256:<digest>
          ports:
            - { name: http, containerPort: 8800 }
          envFrom:
            - configMapRef: { name: aiscientist-config, optional: true }
            - secretRef: { name: aiscientist-secrets }
          volumeMounts:
            - { name: data, mountPath: /data/aiscientist }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          startupProbe:                    # a first start migrates the database
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 8Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: aiscientist-data }
---
apiVersion: v1
kind: Service
metadata:
  name: aiscientist
  labels: { app.kubernetes.io/name: aiscientist }
spec:
  selector: { app.kubernetes.io/name: aiscientist }
  ports:
    - { name: http, port: 80, targetPort: http }
