# nginx reverse proxy for the AiScientist console (AiScientist).
#
# Public domain : https://<PUBLIC_HOSTNAME>   (IT ticket INC0907754)
# Host          : eyeserver <GATEWAY_HOST>, ports 80 + 443
# Upstream      : the FastAPI/uvicorn app, bound to 127.0.0.1:8800 (localhost only — never
#                 expose the app port directly; nginx is the ONLY public face).
#
# Why a reverse proxy (not the app on 0.0.0.0): nginx terminates TLS, adds HTTP->HTTPS
# redirect, upgrades WebSockets, and lets us cap/secure the public surface while the app
# keeps its safe localhost bind. The app is a STATEFUL singleton (per-session SSH tunnels
# to HPC3), so there is exactly one upstream — no load balancing.
#
# Install:  sudo cp this file -> /etc/nginx/sites-available/aiscientist.example.conf
#           sudo ln -s ../sites-available/...conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Needs:    a TLS cert for the domain (see deploy/README.md — SOM/OIT-issued or Let's Encrypt).

upstream bioagent_console {
    server 127.0.0.1:8800;
    keepalive 16;
}

# --- HTTP :80 -> redirect to HTTPS (keep ACME path open for certbot, if used) ----------
server {
    listen 80;
    listen [::]:80;
    server_name <PUBLIC_HOSTNAME>;

    # Let's Encrypt HTTP-01 challenge (only used if you go the certbot route).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 -> reverse proxy to the console ----------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <PUBLIC_HOSTNAME>;

    # TLS cert — point these at the SOM/OIT-issued cert (or the certbot path).
    # SOM/OIT cert (typical): drop the fullchain + key here, then `nginx -t && systemctl reload nginx`.
    ssl_certificate     /etc/ssl/AiScientist/fullchain.pem;
    ssl_certificate_key /etc/ssl/AiScientist/privkey.pem;
    # certbot alternative:
    #   ssl_certificate     /etc/letsencrypt/live/<PUBLIC_HOSTNAME>/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/<PUBLIC_HOSTNAME>/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Security headers (the app already sets its own where needed).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Dataset uploads can be large (.h5ad / 10x). Allow big bodies and stream them through
    # rather than buffering the whole file to disk first.
    client_max_body_size 8g;
    proxy_request_buffering off;

    # Long-lived: research runs stream events for many minutes, and the first connect waits
    # up to ~10 min for vLLM to load on HPC3. Don't let nginx time these out.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # WebSocket — the live run/event stream at /ws/{connection_id}.
    location /ws/ {
        proxy_pass http://bioagent_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep idle WS open across a long run
    }

    location / {
        proxy_pass http://bioagent_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # tells the app it's behind HTTPS
        proxy_buffering off;        # stream SSE/chat tokens straight through
    }
}
