name: PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    name: Policy and collaboration checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AiScientist PR review gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/pr_review_gate.py

  offline-validation:
    name: Offline validation subset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # Same install as ci.yml (see the note there): without the gateway extra, every test that
        # imports a helper out of aiscientist.gateway fails on `No module named 'fastapi'`. ci.yml
        # was fixed in c463c9a and this file was not; it runs only on pull_request, so nothing
        # noticed until PR #32 — 18 failed + 42 errors, all that one import, main included.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gateway]" -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest
