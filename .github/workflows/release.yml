name: Release

# Build a runtime-only app package when a version tag is pushed, and attach it to a GitHub Release
# together with SHA256SUMS. The Eye Server installs it with deploy/deploy_release.sh <tag>.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Build and publish release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime-only package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NAME="aiscientist-${TAG}"
          mkdir -p "dist/${NAME}"
          # Runtime files only: no tests, docs, examples or dev tooling.
          cp -r src frontend preset_pipelines skills configs deploy pyproject.toml LICENSE README.md \
             requirements.txt requirements-gateway.txt start.sh "dist/${NAME}/"
          {
            echo "tag=${TAG}"
            echo "sha=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "dist/${NAME}/VERSION"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aiscientist-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
