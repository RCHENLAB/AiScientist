# What AiScientist runs on HPC3, pinned: each container image with its source and SHA-256, and each
# model's weights with their exact revision and the SHA-256 of every weight file. Paths are relative
# to the shared root (AISCIENTIST_HPC_SHARED_ROOT, /dfs3b/ruic20_lab/software/AiScientist).
#
# The settings that choose an image or a model (AISCIENTIST_*_IMAGE, AISCIENTIST_VLLM_MODEL, the
# model list, AISCIENTIST_SHARED_LLM_*) name one of these; how the LLM servers are launched is in
# gateway/settings.py, gateway/shared_llm.py and deploy/dsv4/. Each run's manifest.json records the
# entries it used (agents/run_manifest.py). `python3 scripts/hpc3_assets_check.py` on HPC3 compares
# this list with the files and prints what differs. A new or rebuilt image, or new weights, is a
# change to this file in the same commit; docs/hpc3_assets.md says how each is built.
#
# Images: never overwritten in place; a rebuild gets a new file name and a new entry.
# Models: `revision` is the Hugging Face commit the snapshot holds; `files` maps each weight file to
# its SHA-256 (in the HF cache, the name of the blob the snapshot links to).
