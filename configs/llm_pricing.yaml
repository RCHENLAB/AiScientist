# Claude API prices used to ESTIMATE what each model call cost (the Account › Usage page, the chat
# header counter, run details, budgets). The Claude Console is the authoritative record of what a key
# actually spent; these numbers only turn the token counts AiScientist recorded into dollars.
#
# Prices change: when Anthropic publishes new ones, edit this file (or point
# AISCIENTIST_LLM_PRICING_FILE at a copy outside the deployment) and restart the gateway. A call is
# priced when it is recorded, so an edit applies to new calls and leaves past estimates as they were.
#
# Units: US dollars per million tokens.
#   input        uncached input tokens
#   output       output tokens (thinking included: it is billed as output)
#   cache_write  5-minute cache writes (AiScientist only writes 5-minute entries)
#   cache_write_1h  1-hour cache writes
#   cache_read   cache reads
# `match` is a model-id prefix; the longest matching prefix wins, so "claude-opus-5-5" is not
# priced as "claude-opus-5". A model that matches nothing is recorded without an estimate (its
# tokens still count) rather than priced at a guess.
# `long_context` (optional): the prices for a request whose prompt (input + cache reads + cache
# writes) is longer than `above_input_tokens`.

as_of: "2026-10-16"
source: "https://platform.claude.com/docs/en/about-claude/pricing"
currency: USD

models:
  - match: claude-fable-5-1
    input: 10.00
    output: 50.00
    cache_write: 12.50
    cache_write_1h: 20.00
    cache_read: 0.25
