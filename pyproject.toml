[project]
name = "aiscientist"
version = "0.4.2"
description = "AiScientist — a privacy-first, DAG-planned multi-agent bioinformatics research console (UCI HPC3 + vLLM) for single-cell / ocular biology workflows."
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.0",
]

[project.optional-dependencies]
gateway = [
  "paramiko>=3.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  # The plan as a YAML document (agents/plan_doc.py, AISCIENTIST_PLAN_YAML). Already present on
  # every gateway host through uvicorn[standard]; named here because the code now imports it.
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",  # durable plan estimates and compute usage, including auth-free deployments
]
# LangGraph execution shell (agents/lab_graph.py, LabConfig.planner="langgraph").
# DELIBERATELY NOT part of `gateway`: installing it pulls ~19 transitive packages
# (langchain-core, langsmith, orjson, ormsgpack, zstandard, websockets, …) into the
# production gateway, and the default "linear"/"dag" planners must keep working on a host
# that has never seen it. `lab_graph` is imported lazily and its tests importorskip, so a
# deploy without this extra behaves exactly as before.
langgraph = [
  "langgraph>=1.2",
]
# Native Anthropic transport for users' own Claude keys (gateway/anthropic_client.py). Imported
# lazily: without it a Claude key is refused at verification with "SDK not installed" and every
# other provider works as before. 1.13 is the version the transport was built and tested against.
anthropic = [
  "anthropic>=1.13,<2",
]
# Croissant metadata (aiscientist.metadata, issue 9): mlcroissant is the reference validator and reads
# a record set's rows for the MCP preview. Optional at runtime: without it the gateway still writes and
# checks every croissant.json with its own rules, and previews with the csv module. CI installs it
# (requirements-dev.txt), so every generated document is validated by mlcroissant on each change.
metadata = [
  "mlcroissant>=1.1",
]
# User accounts / login / admin (eye-server). SQLAlchemy 2.0 models + Alembic
# migrations; bcrypt for password hashing; itsdangerous for signed session cookies;
# psycopg (v3) is the PostgreSQL driver in prod. Local dev/CI uses SQLite (stdlib),
# so psycopg/alembic are only needed on the server. NO external API — fully local.
auth = [
  "sqlalchemy>=2.0",
  "bcrypt>=4.1",
  "itsdangerous>=2.1",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
]
# Real Biomni runtime (eye-server only). The core + CI stay light; the
# RealBiomniRuntime imports biomni lazily, so this is needed only to execute.
biomni = [
  "biomni",
]
# Deep literature agent (PaperQA2 — the open-source engine behind Edison Literature).
# Eye-server only; imported lazily by tools/paperqa_search.py, so the core/CI stay light
# and a host without it just gets status="dependency_missing". The [local] extra pulls in
# sentence-transformers for a LOCAL embedding model, so chunk text never leaves UCI; the
# LLM is pointed at the session's local Qwen vLLM endpoint (no cloud model).
literature = [
  "paper-qa[local]>=5",
]
# The Eye Server copy of the RetiGene index (gateway/local_corpus.py): a search embeds its queries with
# PubMedBERT on the gateway's CPU instead of a Slurm job on HPC3. Install torch from the CPU index
# first (deploy/deploy_release.sh does), or pip pulls the CUDA build and its NVIDIA libraries, which
# this server never uses. Without this extra the searches run on HPC3.
corpus = [
  "sentence-transformers>=3",
]
# Single-cell analysis stack for the run_code (CodeAct) sandbox + the analysis line
# (real scanpy QC/cluster/DE + gseapy enrichment + matplotlib figures). Eye-server
# only; the lightweight core/CI never import these. The CodeSandbox runs the app
# venv's python, so installing this extra into the app venv lets generated analysis
# code `import scanpy/gseapy`. System tools (apt, not pip): `pandoc texlive-xetex`
# for PDF rendering, `graphviz` for deterministic schematic figures (the `dot` binary).
analysis = [
  "scanpy>=1.10",
  "pydeseq2>=0.4",           # pseudobulk DE: DESeq2's NB Wald test (run_pseudobulk_de)
  "anndata>=0.10",
  "gseapy>=1.1",
  "matplotlib>=3.8",
  "leidenalg>=0.10",
  "pandas>=2.0",
]

[project.scripts]
aiscientist-console = "aiscientist.gateway.app:main"
aiscientist-admin = "aiscientist.gateway.admin_cli:main"
# Old command names, kept for operators' muscle memory and existing docs/scripts.
bioagent-console = "aiscientist.gateway.app:main"
bioagent-admin = "aiscientist.gateway.admin_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["runs", ".adaptive_kg", ".venv"]

[tool.ruff.lint]
# Conservative gate: pyflakes (real bugs: unused/undefined names) + pycodestyle
# error subset + syntax errors. Style nits are not enforced as a merge blocker.
select = ["E4", "E7", "E9", "F"]
